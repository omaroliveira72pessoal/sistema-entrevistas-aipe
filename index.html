<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f7f6; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    .primario { background: #17365d; color: white; }
    .finalizar { background: #991b1b; color: white; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; color: #17365d; }
  </style>
</head>
<body>
  <div class="container">
    <h3>AIPe - Gravação de Entrevista</h3>
    <div id="setup">
      <label>Função:</label>
      <select id="grupo" onchange="gerarCod()">
        <option value="">Selecione...</option>
        <option value="PROFESSOR">Professor</option>
        <option value="DIRETOR">Diretor</option>
        <option value="TECNICO">Técnico</option>
      </select>
      <input type="text" id="codPart" readonly placeholder="Código gerado...">
      <button class="primario" onclick="preparar()">1. INICIAR REGISTRO</button>
    </div>

    <div id="gravacao" style="display:none;">
      <div id="status">Pronto para gravar</div>
      <button id="btnGravar" class="primario" onclick="iniciarGravacao()">🎙 INICIAR GRAVAÇÃO</button>
      <button id="btnParar" class="finalizar" onclick="pararGravacao()" disabled>⏹ PARAR E ENVIAR</button>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let idAtual = "";

    function gerarCod() {
      const g = document.getElementById('grupo').value;
      google.script.run.withSuccessHandler(c => {
        document.getElementById('codPart').value = c;
      }).gerarProximoCodigoParticipante_(g);
    }

    function preparar() {
      const dados = {
        grupo: document.getElementById('grupo').value,
        codigoParticipante: document.getElementById('codPart').value,
        modalidade: "Presencial",
        gravacaoAutorizada: "SIM",
        coordenadoria: "Sede",
        codEscola: "001"
      };
      google.script.run.withSuccessHandler(res => {
        idAtual = res.idEntrevista;
        document.getElementById('setup').style.display = 'none';
        document.getElementById('gravacao').style.display = 'block';
        document.getElementById('status').innerText = "Registro: " + idAtual;
      }).iniciarEntrevista(dados);
    }

    async function iniciarGravacao() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => enviarAudio();
        
        mediaRecorder.start();
        document.getElementById('btnGravar').disabled = true;
        document.getElementById('btnParar').disabled = false;
        document.getElementById('status').innerText = "🔴 GRAVANDO...";
      } catch (err) {
        alert("Erro no microfone: Verifique se deu permissão ao navegador.");
      }
    }

    function pararGravacao() {
      mediaRecorder.stop();
      document.getElementById('btnParar').disabled = true;
      document.getElementById('status').innerText = "Enviando áudio...";
    }

    function enviarAudio() {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[4];
        google.script.run.withSuccessHandler(() => {
          document.getElementById('status').innerText = "✅ ÁUDIO SALVO!";
          alert("Concluído!");
        }).salvarAudioNoDrive(base64, idAtual);
      };
    }
  </script>
</body>
</html>
